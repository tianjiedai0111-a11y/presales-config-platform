<body>
  <a class="skipLink" href="#printArea">跳到配置内容</a>
  <div id="loginScreen" class="loginScreen">
    <section class="loginCard">
      <div class="loginLogo"><img src="logo.png" alt="ForwardX Robotics"></div>
      <h1 id="loginTitle">售前配置平台</h1>
      <p id="loginSub">请输入账号密码继续</p>
      <div class="loginForm">
        <input id="loginUser" type="text" autocomplete="username" placeholder="用户名" aria-label="用户名">
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="密码" aria-label="密码">
        <button class="btn" id="loginBtn">登录</button>
        <div class="loginError" id="loginError" role="alert"></div>
      </div>
    </section>
  </div>
  <div id="appShell" class="appShell isHidden">
  <header class="top">
    <div class="brand"><div class="logoBox"><img src="logo.png" alt="Logo"></div><div><h1 id="appTitle">售前配置平台</h1></div></div>
    <div class="actions">
      <div class="menu" id="templateMenu">
        <button class="btn2" id="templateMenuBtn" type="button" aria-expanded="false">模板</button>
        <div class="menuPanel" id="templateMenuPanel">
          <label class="upload">上传模板<input id="fileInput" type="file" accept=".xlsx,.xls"></label>
          <button class="btn2" id="downloadTplBtn" aria-label="下载配置模板">下载模板</button>
        </div>
      </div>
      <button class="btn2" id="clearBtn" aria-label="清空当前本地暂存">清空暂存</button>
      <label class="upload">上传PDF恢复<input id="pdfInput" type="file" accept=".pdf"></label>
      <button class="btn" id="pdfBtn" aria-label="导出PDF">导出 PDF</button>
      <button class="btn2" id="langBtn" aria-label="切换语言">EN</button>
      <button class="btn2" id="logoutBtn" aria-label="退出登录">退出</button>
    </div>
  </header>
  <div class="status"><span id="fileStatus">正在加载默认模板...</span><span id="userStatus"></span></div>
  <main id="printArea" class="wrap" tabindex="-1"></main>
  <div id="loading" class="loading">正在解析模板...</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal"><div class="modalInner"><div class="modalTitle"><strong id="modalTitle"></strong><button class="ghost" id="modalClose">关闭</button></div><img id="modalImg" alt="配图"></div></div>
  </div>

    function decodeDraft(text){

      const start = compact.indexOf(RESTORE_PREFIX);
      if(start < 0) return null;
      const body = compact.slice(start + RESTORE_PREFIX.length).match(/[A-Za-z0-9+/=]+/)?.[0] || "";

    async function parseCellImages(file){
      const zip = await JSZip.loadAsync(file);
      const imgXml = zip.file("xl/cellimages.xml");
      const relXml = zip.file("xl/_rels/cellimages.xml.rels");
      if(!imgXml || !relXml) return {};
      const [imgText, relText] = await Promise.all([imgXml.async("text"), relXml.async("text")]);
      const relMap = {};
      [...relText.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)].forEach(m => relMap[m[1]] = "xl/" + m[2]);
      const out = {};
      const blocks = imgText.match(/<etc:cellImage[\s\S]*?<\/etc:cellImage>/g) || [];
      for(const block of blocks){
        const id = block.match(/<xdr:cNvPr[^>]*name="([^"]+)"/)?.[1];
        const rid = block.match(/r:embed="([^"]+)"/)?.[1];
        const target = relMap[rid];
        if(id && target && zip.file(target)){
          const blob = await zip.file(target).async("blob");
          out[id] = URL.createObjectURL(blob);
        }
      }
      return out;
    }

    function imageId(v){ return norm(v).match(/DISPIMG\("([^"]+)"/)?.[1] || ""; }
    function parseDevices(wb, images){
      const sheet = wb.Sheets["对接设备"];
      if(!sheet) return {};
      const matrix = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" }).map(r => r.map(norm));
      const headers = matrix[0] || [];
      const devices = {};
      matrix.slice(1).forEach((cells, idx) => {
        const type = cells[0], subtype = cells[1];
        if(!type || !subtype) return;
        const translation = cells[2] || "";
        const mainImage = images[imageId(cells[3])] || "";
        const item = { id:`device-${idx}-${type}-${subtype}`, type, subtype, translation, images:[], fields:[] };
        if(mainImage) item.images.push({ title:`${subtype}案例图片`, url:mainImage });
        let currentImage = "";
        for(let c=4;c<headers.length;c++){
          const header = headers[c] || "";
          const value = cells[c] || "";
          if(header.includes("配图")){
            const img = images[imageId(value)] || "";
            currentImage = img;
            if(img) item.images.push({ title:header, url:img });
            continue;
          }
          if(!header.startsWith("填写项")) continue;
          if(!value || value === "/") continue;
          item.fields.push({ name:value, imageUrl:currentImage });
        }
        if(!devices[type]) devices[type] = [];
        devices[type].push(item);
      });
      return devices;
    }
    function parseTranslations(wb){
      const sheet = wb.Sheets["英文翻译"] || wb.Sheets["????"];
      if(!sheet) return {};
      const matrix = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" }).map(r => r.map(norm));
      const out = {};
      matrix.slice(1).forEach(cells => {
        const zh = cells[0], en = cells[1];
        if(zh && en) out[zh.normalize("NFKC")] = en;
      });
      return out;
    }

    async function parseWorkbook(file){
      $("loading").classList.add("show");
      try{
        currentTemplateBlob = file;
        currentTemplateName = file.name || currentTemplateName;
        const [buffer, images] = await Promise.all([file.arrayBuffer(), parseCellImages(file)]);
        const wb = XLSX.read(buffer, { type:"array", cellFormula:true, cellNF:false, cellText:false });
        const sheet = wb.Sheets["配置数据库"] || wb.Sheets[wb.SheetNames[0]];
        const matrix = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" }).map(r => r.map(norm));
        let group = "", models = [], modelStart = 6;
        const rows = [];
        matrix.forEach((cells, idx) => {
          const name = cells[0];
          if(!name) return;
          if(sectionNames.has(name)){
            group = name;
            if(name === "售前配置项"){
              modelStart = 6;
              models = cells.slice(modelStart).filter(Boolean);
            }
            return;
          }
          const img = imageId(cells[1]);
          const row = { id: `${idx}-${name}`, name, group, imageUrl: images[img] || "", displaySection: cells[2], inputType: cells[3], required: cells[4] === "是", remark: cells[5], values:{} };
          if(group !== "项目基本信息") models.forEach((m,i)=> row.values[m] = cells[modelStart+i] || "");
          rows.push(row);
        });
        templateTranslations = parseTranslations(wb);
        config = { fileName:file.name, models, rows, devices:parseDevices(wb, images) };
        if(!config.models.includes(draft.model)) draft.model = "";
        $("fileStatus").textContent = `${t("tpl")}: ${displayFileName(currentTemplateName)}`;
        save(); render();

      const action = skipped
        ? `<button class="btn" data-need="${title}">${t("need")} ${sectionTitle(title)}</button>`
        : `<button class="btn2" data-skip="${title}">${t("noNeed")} ${sectionTitle(title)}</button><button class="btn" data-add="${title}">${t("newItem")} ${sectionTitle(title)}</button>`;
      const body = skipped
        ? `<div class="empty"><strong>${t("noNeedPrefix")} ${sectionTitle(title)}</strong></div>`
        : `<div class="cards ${ids.length===1?"single":""}">${ids.map((id,idx)=>`<div class="card"><div class="cardTitle"><strong>${sectionTitle(title)}${idx+1}</strong>${ids.length>1?`<button class="ghost" data-remove="${title}" data-id="${id}">${t("delete")}</button>`:""}</div>${visibleRepeaterRows(title,listRows,id).map(r=>field(r,title,id)).join("")}</div>`).join("")}</div>`;
      return `<section class="band" id="${sectionId(title)}"><div class="head"><h2>${sectionTitle(title)}</h2><div class="actions">${action}</div></div>${body}</section>`;
    }
    function deviceRepeater(title){
      const list = config?.devices?.[title] || [];
      if(!list.length) return "";
      const ids = draft.repeaters[title] || ["1"];
      draft.repeaters[title] = ids;
      const skipped = draft.repeaters[`${title}::skip`] === true;
      const action = skipped
        ? `<button class="btn" data-need="${title}">${t("need")} ${sectionTitle(title)}</button>`
        : `<button class="btn2" data-skip="${title}">${t("noNeed")} ${sectionTitle(title)}</button><button class="btn" data-add="${title}">${t("newItem")} ${sectionTitle(title)}</button>`;
      const body = skipped ? `<div class="empty"><strong>${t("noNeedPrefix")} ${sectionTitle(title)}</strong></div>` : `<div class="cards ${ids.length===1?"single":""}">${ids.map((id,idx)=>{
        const subtypeKey = keyOf(title,"子类型",id);
        const selectedName = draft.values[subtypeKey] || list[0].subtype;
        const selected = list.find(x => x.subtype === selectedName) || list[0];
        const gallery = selected.images.length ? `<div class="deviceGallery">${selected.images.map(img=>`<img src="${img.url}" alt="${escapeHtml(labelText(img.title))}" data-img="${img.url}" data-title="${escapeHtml(labelText(img.title))}">`).join("")}</div>` : "";
        const subtypeLabel = `${sectionTitle(title)} ${lang === "en" ? "Subtype" : "子类型"}`;
        const selectedRemark = lang === "en" ? (selected.translation || labelText(selected.subtype)) : selected.translation;
        const selector = `<div class="field"><div class="meta"><div><div class="name">${subtypeLabel}<span class="req">*</span></div>${selectedRemark ? `<div class="remark">${escapeHtml(labelText(selectedRemark))}</div>` : ""}</div></div><select data-device-subtype="${title}" data-card="${id}" data-key="${subtypeKey}" aria-label="${subtypeLabel}">${list.map(item=>{
          const optionText = lang === "en" ? (item.translation || labelText(item.subtype)) : `${item.subtype}${item.translation?` / ${item.translation}`:""}`;
          return `<option value="${escapeHtml(item.subtype)}" ${item.subtype===selected.subtype?"selected":""}>${escapeHtml(labelText(optionText))}</option>`;
        }).join("")}</select></div>`;
        return `<div class="card"><div class="cardTitle"><strong>${sectionTitle(title)}${idx+1}</strong>${ids.length>1?`<button class="ghost" data-remove="${title}" data-id="${id}">${t("delete")}</button>`:""}</div>${gallery}<div class="grid">${selector}${selected.fields.map(r=>deviceField(r,title,id,true)).join("")}</div></div>`;
      }).join("")}</div>`;
      return `<section class="band" id="${sectionId(title)}"><div class="head"><h2>${sectionTitle(title)}</h2><div class="actions">${action}</div></div>${body}</section>`;
    }

    function render(){
      const root = $("printArea");
      if(!config){ root.innerHTML = `<section class="empty"><strong>${lang === "en" ? "Upload a configuration template to start" : "请上传售前配置模板"}</strong></section>`; return; }
      const basic = rows("项目基本信息").filter(r=>r.name!=="车型");
      const selectedSeries = draft.series || modelSeries(draft.model);
      const seriesOptions = seriesList();
      const filteredModels = selectedSeries ? modelsBySeries(selectedSeries) : [];
      if(draft.model && selectedSeries && !filteredModels.includes(draft.model)) draft.model = "";
      const seriesSelect = `<div class="field"><div class="meta"><div class="name">${t("series")}<span class="req">*</span></div></div><select id="seriesSelect" aria-label="${t("series")}"><option value="">${t("chooseSeries")}</option>${seriesOptions.map(s=>`<option value="${escapeHtml(s)}" ${selectedSeries===s?"selected":""}>${escapeHtml(labelText(s))}</option>`).join("")}</select></div>`;
      const modelSelect = `<div class="field"><div class="meta"><div class="name">${t("model")}<span class="req">*</span></div></div><select id="modelSelect" aria-label="${t("model")}" ${selectedSeries?"":"disabled"}><option value="">${t("chooseModel")}</option>${filteredModels.map(m=>`<option value="${escapeHtml(m)}" ${draft.model===m?"selected":""}>${escapeHtml(labelText(m))}</option>`).join("")}</select></div>`;
      let html = `<section class="band" id="basic"><div class="head"><h2>${t("basic")}</h2></div><div class="grid">${basic.map(r=>field(r)).join("")}${seriesSelect}${modelSelect}</div></section>`;
      if(!draft.model){ root.innerHTML = html + `<section class="empty"><strong>${t("chooseModelFirst")}</strong></section>`; bind(); return; }
      html += `<nav class="quickNav"><strong>${escapeHtml(labelText(draft.model))}</strong><a class="navChip" href="#basic">${t("basic")}</a><a class="navChip" href="#sales">${t("sales")}</a><a class="navChip" href="#power">${t("power")}</a><a class="navChip" href="#pallet">${t("pallet")}</a><a class="navChip" href="#rack">${t("rack")}</a><a class="navChip" href="#defaultConfig">${t("defaults")}</a></nav>`;
      const sales = rows("售前配置项","售前填写");
      const power = rows("用电相关","售前填写");
      const pallet = rows("托盘","售前填写");
      const rack = rows("料架","售前填写");
      const def = rows("默认配置","默认配置");
      html += `<section class="band" id="sales"><div class="head"><h2>${t("sales")}</h2></div><div class="grid">${salesRemarkCard()}${sales.map(r=>field(r)).join("")}</div></section>`;
      html += `<section class="band" id="power"><div class="head"><h2>${t("power")}</h2></div><div class="grid">${power.map(r=>field(r)).join("")}</div></section>`;
      if(config.devices?.["托盘"]?.length) html += deviceRepeater("托盘");
      else if(pallet.length) html += repeater("托盘", pallet);
      if(config.devices?.["料架"]?.length) html += deviceRepeater("料架");
      else if(rack.length) html += repeater("料架", rack);
      const defaultOpen = draft.defaultOpen === true;
      html += `<section class="band" id="defaultConfig"><div class="head"><h2>${t("defaults")}</h2><button class="ghost" data-toggle-default aria-expanded="${defaultOpen}">${defaultOpen ? t("hide") : t("show")}</button></div>${defaultOpen ? `<div class="grid default">${def.map(r=>field(r,"main","",true)).join("")}</div>` : `<div class="empty"><strong>${lang === "en" ? "Default configuration is collapsed" : "默认配置已收起"}</strong></div>`}</section>`;
      root.innerHTML = html; bind(); save();
    }

    function bind(){
      document.querySelectorAll("[data-key]").forEach(el => el.oninput = el.onchange = e => {
        draft.values[e.target.dataset.key] = e.target.value;
        save();
        if(e.target.dataset.key.startsWith("料架::料架类型::") || e.target.dataset.deviceSubtype) render();
      });
      document.querySelectorAll("[data-date]").forEach(el => {
        if(!window.flatpickr) return;
        window.flatpickr(el, {
          dateFormat:"Y-m-d",
          allowInput:true,
          disableMobile:true,
          locale: lang === "zh" && window.flatpickr.l10ns?.zh ? window.flatpickr.l10ns.zh : "default",
          onChange: (_, value) => {
            draft.values[el.dataset.key] = value;
            save();
          },
          onClose: (_, value) => {
            draft.values[el.dataset.key] = value || el.value;
            save();
          }
        });
      });
      document.querySelectorAll("[data-file]").forEach(el => el.onchange = e => {
        const f = e.target.files[0]; if(!f) return; const reader = new FileReader();
        reader.onload = () => { draft.values[e.target.dataset.file] = { name:f.name, dataUrl:reader.result }; save(); render(); };
        reader.readAsDataURL(f);
      });
      document.querySelectorAll("[data-clear-file]").forEach(el => el.onclick = () => { delete draft.values[el.dataset.clearFile]; save(); render(); });
      document.querySelectorAll("[data-add]").forEach(el => el.onclick = () => { const t=el.dataset.add; draft.repeaters[t] = [...(draft.repeaters[t]||[]), String(Date.now())]; save(); render(); });
      document.querySelectorAll("[data-skip]").forEach(el => el.onclick = () => { const t=el.dataset.skip; draft.repeaters[`${t}::skip`] = true; save(); render(); });
      document.querySelectorAll("[data-need]").forEach(el => el.onclick = () => { const t=el.dataset.need; draft.repeaters[`${t}::skip`] = false; if(!(draft.repeaters[t]||[]).length) draft.repeaters[t] = ["1"]; save(); render(); });
      document.querySelectorAll("[data-remove]").forEach(el => el.onclick = () => { const t=el.dataset.remove; draft.repeaters[t] = (draft.repeaters[t]||[]).filter(x=>x!==el.dataset.id); save(); render(); });
      document.querySelectorAll("[data-img]").forEach(el => el.onclick = () => { $("modalImg").src=el.dataset.img; $("modalTitle").textContent=el.dataset.title; $("modal").classList.add("show"); });
      document.querySelectorAll("[data-toggle-default]").forEach(el => el.onclick = () => { draft.defaultOpen = !draft.defaultOpen; save(); render(); });
      const ss = $("seriesSelect"); if(ss) ss.onchange = e => { draft.series = e.target.value; draft.model = ""; save(); render(); };
      const ms = $("modelSelect"); if(ms) ms.onchange = e => { draft.model = e.target.value; draft.series = modelSeries(draft.model); save(); render(); };
    }
    function displayDraftValue(key, fallback=""){
      const val = draft.values[key];
      if(val && typeof val === "object") return val.name || "Attachment";
      return labelText(val ?? fallback ?? "");
    }
    function displayDraftValueRaw(key, fallback=""){
      const val = draft.values[key];
      if(val && typeof val === "object") return val.name || "附件 / Attachment";
      return norm(val ?? fallback ?? "");
    }
    function rowExportValue(row, prefix="main", cardId="", disabled=false){
      const key = keyOf(prefix, row.name, cardId);
      const raw = row.group === "项目基本信息" ? "" : norm(row.values[draft.model]);
      const fallback = splitOptions(raw).length > 1 ? splitOptions(raw)[0] : raw;
      return disabled ? labelText(raw || "-") : displayDraftValue(key, fallback);
    }
    function rowExportValueRaw(row, prefix="main", cardId="", disabled=false){
      const key = keyOf(prefix, row.name, cardId);
      const raw = row.group === "项目基本信息" ? "" : norm(row.values[draft.model]);
      const fallback = splitOptions(raw).length > 1 ? splitOptions(raw)[0] : raw;
      return disabled ? (raw || "-") : displayDraftValueRaw(key, fallback);
    }
    function reportTable(title, items){
      if(!items.length) return "";
      const rowsHtml = items.map(item => `<tr><th>${escapeHtml(item.name)}</th><td>${escapeHtml(item.value || "-")}</td><td>${escapeHtml(item.remark || "")}</td></tr>`).join("");
      return `<section><h2>${escapeHtml(title)}</h2><table><thead><tr><th>${lang==="en"?"Item":"项目"}</th><th>${lang==="en"?"Value":"内容"}</th><th>${lang==="en"?"Notes":"备注"}</th></tr></thead><tbody>${rowsHtml}</tbody></table></section>`;
    }
    function exportRows(group, section, disabled=false){
      return rows(group, section).map(r => ({
        name: labelText(r.name),
        value: rowExportValue(r, "main", "", disabled),
        remark: labelText(r.remark)
      }));
    }
    function exportRowsBilingual(group, section, disabled=false){
      return rows(group, section).map(r => ({
        name: bilingualText(r.name),
        value: bilingualText(rowExportValueRaw(r, "main", "", disabled)) || "-",
        remark: bilingualText(r.remark)
      }));
    }
    function exportDeviceSection(title){
      if(draft.repeaters[`${title}::skip`] === true) return reportTable(sectionTitle(title), [{ name: sectionTitle(title), value: `${t("noNeedPrefix")} ${sectionTitle(title)}`, remark: "" }]);
      const list = config?.devices?.[title] || [];
      const ids = draft.repeaters[title] || ["1"];
      if(list.length){
        return ids.map((id,idx) => {
          const subtypeKey = keyOf(title,"子类型",id);
          const selectedName = draft.values[subtypeKey] || list[0].subtype;
          const selected = list.find(x => x.subtype === selectedName) || list[0];
          const items = [{ name: `${sectionTitle(title)} ${lang==="en"?"Subtype":"子类型"}`, value: labelText(selected.translation || selected.subtype), remark: "" }]
            .concat(selected.fields.map(r => ({ name: labelText(r.name), value: displayDraftValue(keyOf(title,r.name,id)), remark: "" })));
          return reportTable(`${sectionTitle(title)} ${idx+1}`, items);
        }).join("");
      }
      const listRows = title === "托盘" ? rows("托盘","售前填写") : rows("料架","售前填写");
      return ids.map((id,idx) => reportTable(`${sectionTitle(title)} ${idx+1}`, visibleRepeaterRows(title,listRows,id).map(r => ({
        name: labelText(r.name),
        value: rowExportValue(r,title,id),
        remark: labelText(r.remark)
      })))).join("");
    }
    function collectReportSections(){
      const basicItems = rows("项目基本信息").filter(r=>r.name!=="车型").map(r => ({ name: labelText(r.name), value: displayDraftValue(keyOf("main",r.name)), remark: labelText(r.remark) }))
        .concat([{ name:t("series"), value:labelText(modelSeries(draft.model)), remark:"" }, { name:t("model"), value:labelText(draft.model), remark:"" }]);
      const siteRemark = displayDraftValue(keyOf("main","现场特殊需求备注"));
      const salesItems = [{ name:t("siteRemark"), value:siteRemark, remark:t("siteRemarkHelp") }].concat(exportRows("售前配置项","售前填写"));
      const sections = [
        { title:t("basic"), items:basicItems },
        { title:t("sales"), items:salesItems },
        { title:t("power"), items:exportRows("用电相关","售前填写") },
        { title:t("defaults"), items:exportRows("默认配置","默认配置",true) }
      ];
      return { basicItems, salesItems, sections };
    }

      const basicItems = rows("项目基本信息").filter(r=>r.name!=="车型").map(r => ({

      if(draft.repeaters[`${title}::skip`] === true) return [{ title:sectionTitle(title), items:[{ name: sectionTitle(title), value: `${t("noNeedPrefix")} ${sectionTitle(title)}`, remark: "" }] }];
      const list = config?.devices?.[title] || [];
      const ids = draft.repeaters[title] || ["1"];
      if(list.length){
        return ids.map((id,idx) => {
          const subtypeKey = keyOf(title,"子类型",id);
          const selectedName = draft.values[subtypeKey] || list[0].subtype;
          const selected = list.find(x => x.subtype === selectedName) || list[0];
          const items = [{ name: `${sectionTitle(title)} ${lang==="en"?"Subtype":"子类型"}`, value: labelText(selected.translation || selected.subtype), remark: "" }]
            .concat(selected.fields.map(r => ({ name: labelText(r.name), value: displayDraftValue(keyOf(title,r.name,id)), remark: "" })));

      const titleBi = bilingualText(title);
      if(draft.repeaters[`${title}::skip`] === true) return [{ title:titleBi, items:[{ name:titleBi, value:bilingualText(`该项目无需${title}`), remark:"" }] }];

      if(list.length){
        return ids.map((id,idx) => {
          const subtypeKey = keyOf(title,"子类型",id);

          const selected = list.find(x => x.subtype === selectedName) || list[0];
          const subtypeName = `${title}子类型`;
          const subtypeValue = selected.translation ? `${selected.subtype} / ${selected.translation}` : selected.subtype;
          const items = [{ name:bilingualText(subtypeName), value:bilingualText(subtypeValue), remark:"" }]
            .concat(selected.fields.map(r => ({ name:bilingualText(r.name), value:bilingualText(displayDraftValueRaw(keyOf(title,r.name,id))) || "-", remark:"" })));

    async function exportPdfDirect(fileName){
      if(!window.jspdf?.jsPDF) throw new Error("jspdf-not-loaded");
      const pdf = new jspdf.jsPDF("p","mm","a4");
      if(window.PDF_FONT_SIMHEI_BASE64){
        pdf.addFileToVFS("simhei.ttf", window.PDF_FONT_SIMHEI_BASE64);
        pdf.addFont("simhei.ttf", "SimHei", "normal");
        pdf.setFont("SimHei", "normal");
      }
      pdf.setProperties({
        title:fileName.replace(/\.pdf$/i,""),
        subject:RESTORE_PREFIX + encodeDraft(),
        creator:t("title")
      });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 12;
      const widths = [50, 78, pageW - margin * 2 - 50 - 78];
      let y = 14;
      const lineH = 5.2;
      const addPageIfNeeded = h => {
        if(y + h > pageH - margin){ pdf.addPage(); y = margin; }
      };
      const textLines = (text, width, size=9) => {
        pdf.setFontSize(size);
        return pdf.splitTextToSize(String(text || "-"), width - 4);
      };
      const drawRow = (cells, header=false) => {
        const size = header ? 9 : 8.4;
        const lines = cells.map((c,i) => textLines(c, widths[i], size));
        const h = Math.max(8, ...lines.map(l => l.length * lineH + 3));
        addPageIfNeeded(h);
        let x = margin;
        pdf.setDrawColor(190, 207, 199);
        cells.forEach((_, i) => {
          if(header){ pdf.setFillColor(232, 244, 238); pdf.rect(x, y, widths[i], h, "FD"); }
          else pdf.rect(x, y, widths[i], h);
          pdf.setTextColor(header ? 5 : 20, header ? 72 : 20, header ? 50 : 20);
          pdf.setFontSize(size);
          pdf.text(lines[i], x + 2, y + 5);
          x += widths[i];
        });
        y += h;
      };
      const drawSection = section => {
        if(!section.items.length) return;
        addPageIfNeeded(18);
        pdf.setFontSize(14);
        pdf.setTextColor(4, 74, 51);
        pdf.text(section.title, margin, y);
        y += 7;
        drawRow(["项目 / Item", "内容 / Value", "备注 / Notes"], true);
        section.items.forEach(item => drawRow([item.name, item.value || "-", item.remark || ""]));
        y += 5;
      };
      pdf.setFontSize(17);
      pdf.setTextColor(3, 45, 31);
      pdf.text("售前配置平台 / Presales Configuration", margin, y);
      y += 8;
      pdf.setFontSize(9);
      pdf.setTextColor(80, 92, 88);
      pdf.text(`模板 / Template: ${config.fileName}    车型 / Model: ${bilingualText(draft.model)}`, margin, y);
      y += 8;
      const report = collectReportSectionsBilingual();
      drawSection(report.sections[0]);
      drawSection(report.sections[1]);
      drawSection(report.sections[2]);
      deviceReportSectionsBilingual("托盘").forEach(drawSection);
      deviceReportSectionsBilingual("料架").forEach(drawSection);
      drawSection(report.sections[3]);
      pdf.setFontSize(1);
      pdf.setTextColor(255,255,255);
      pdf.text(RESTORE_PREFIX + encodeDraft(), margin, pageH - 3);
      pdf.save(fileName);
    }

        th{width:28%;background:#eef6f2;text-align:left} td:nth-child(2){width:44%} td:nth-child(3){width:28%;color:#555}
        @page{size:A4;margin:14mm}@media print{body{margin:0}.noPrint{display:none}}
      </style></head><body><h1>售前配置平台 / Presales Configuration</h1><div class="meta">模板 / Template: ${escapeHtml(config.fileName)} · 车型 / Model: ${escapeHtml(bilingualText(draft.model))}</div>${body}<div class="restore">${RESTORE_PREFIX + encodeDraft()}</div>${autoPrint ? "<script>setTimeout(()=>window.print(),300)<\\/script>" : ""}</body></html>`;
    }
    function printExportForm(fileName){
      const html = exportHtml(fileName, false);
      const iframe = document.createElement("iframe");
      iframe.style.position = "fixed";
      iframe.style.right = "0";
      iframe.style.bottom = "0";
      iframe.style.width = "1px";
      iframe.style.height = "1px";
      iframe.style.border = "0";
      iframe.setAttribute("aria-hidden","true");
      document.body.appendChild(iframe);
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(html);
      doc.close();
      setTimeout(() => {
        try{
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
          showToast(t("printHint"));
        }catch(err){
          downloadBlob(new Blob([exportHtml(fileName, true)], { type:"text/html;charset=utf-8" }), fileName.replace(/\.pdf$/i,"") + ".html");
        }
        setTimeout(() => iframe.remove(), 30000);
      }, 300);
    }

    $("loginBtn").onclick = () => {
      const user = norm($("loginUser").value).toUpperCase();
      const pass = $("loginPass").value;
      if(USERS[user] === pass){
        localStorage.setItem(AUTH_KEY, user);
        $("loginError").textContent = "";
        updateAuthUI();
      }else{
        $("loginError").textContent = t("loginFail");
      }
    };
    $("loginPass").onkeydown = e => { if(e.key === "Enter") $("loginBtn").click(); };
    $("logoutBtn").onclick = () => { localStorage.removeItem(AUTH_KEY); updateAuthUI(); };
    $("langBtn").onclick = () => { lang = lang === "zh" ? "en" : "zh"; localStorage.setItem("presales-config-lang", lang); applyLanguage(); render(); };
    $("templateMenuBtn").onclick = e => {
      e.stopPropagation();
      const menu = $("templateMenu");
      const open = !menu.classList.contains("open");
      menu.classList.toggle("open", open);
      $("templateMenuBtn").setAttribute("aria-expanded", String(open));
    };
    document.addEventListener("click", e => {
      if(!$("templateMenu")?.contains(e.target)){
        $("templateMenu")?.classList.remove("open");
        $("templateMenuBtn")?.setAttribute("aria-expanded","false");
      }
    });
    $("downloadTplBtn").onclick = () => {
      $("templateMenu").classList.remove("open");
      const pwd = prompt(t("pwdPrompt"));
      if(pwd !== "forwardx"){ alert(t("pwdWrong")); return; }
      if(!currentTemplateBlob){
        const a = document.createElement("a");
        a.href = encodeURI(currentTemplateName || "售前配置模板.xlsx");
        a.download = currentTemplateName || "售前配置模板.xlsx";
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast(t("tplDownloaded"));
        return;
      }
      downloadBlob(currentTemplateBlob, currentTemplateName || "售前配置模板.xlsx");
      showToast(t("tplDownloaded"));
    };
    $("fileInput").onchange = e => { $("templateMenu").classList.remove("open"); const f=e.target.files[0]; if(f) parseWorkbook(f); };
    $("pdfInput").onchange = async e => {
      const f = e.target.files[0]; if(!f) return;
      if(!window.pdfjsLib){ alert(lang === "en" ? "PDF parser is not loaded. Please check the network and try again." : "PDF解析组件未加载，请检查网络后重试。"); return; }
      $("loading").classList.add("show");
      try{
        const doc = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
        const meta = await doc.getMetadata().catch(() => null);
        const metaText = [meta?.info?.Subject, meta?.info?.Keywords, meta?.metadata?.get("dc:description")].filter(Boolean).join("\n");
        let text = "";
        for(let i=1;i<=doc.numPages;i++){
          const page = await doc.getPage(i);
          const content = await page.getTextContent();
          text += content.items.map(x=>x.str).join("") + "\n";
        }
        const restored = decodeDraft(metaText) || decodeDraft(text);
        if(!restored?.draft) throw new Error("not-found");
        draft = restored.draft;
        if(config && !config.models.includes(draft.model)) draft.model = "";
        save(); render();
        $("fileStatus").textContent = `${t("restored")}：${f.name}`;
      }catch(err){
        alert(lang === "en" ? "No recoverable configuration data was found in this PDF. Please upload a PDF exported from this platform." : "没有在这个PDF里找到可恢复的配置数据。请上传本平台导出的PDF。");
      }finally{
        $("loading").classList.remove("show");
        e.target.value = "";
      }
    };
    $("clearBtn").onclick = () => {
      if(!confirm(t("clearConfirm"))) return;
      draft = { series:"", model:"", values:{}, repeaters:{} };
      save(); render();
    };
    $("modalClose").onclick = () => $("modal").classList.remove("show");
    $("modal").onclick = e => { if(e.target.id === "modal") $("modal").classList.remove("show"); };
    $("pdfBtn").onclick = async () => {
      if(!config){ alert(lang === "en" ? "Load a configuration template before exporting." : "请先加载配置模板后再导出。"); return; }
      if(!draft.model){ alert(lang === "en" ? "Select a model before exporting PDF." : "请先选择车型后再导出PDF。"); return; }
      const btn = $("pdfBtn");
      const fileName = exportFileName();
      btn.disabled = true;
      btn.textContent = t("pdfGenerating");
      $("loading").textContent = t("pdfGenerating");
      $("loading").classList.add("show");
      try{
        await exportPdfDirect(fileName);
        showToast(`${t("pdfDone")}: ${fileName}`);
      }catch(err){
        downloadBlob(new Blob([exportHtml(fileName, true)], { type:"text/html;charset=utf-8" }), fileName.replace(/\.pdf$/i,"") + ".html");
        showToast(lang === "en" ? "PDF export fallback downloaded as printable HTML." : "PDF 直接导出失败，已下载可打印 HTML 兜底。");
      }finally{
        btn.disabled = false;
        btn.textContent = t("exportPdf");
        $("loading").textContent = t("loadingTpl");
        $("loading").classList.remove("show");
      }
    };

    updateAuthUI();
    const defaultTemplateUrl = location.protocol === "file:" ? "售前配置模板.xlsx" : "售前配置模板.xlsx?v=" + Date.now();
    fetch(defaultTemplateUrl).then(r => r.ok ? r.blob() : null).then(blob => {
      if(blob) parseWorkbook(new File([blob],"售前配置模板.xlsx"));
      else render();
    }).catch(render);
  </script>
</body>
</html>
